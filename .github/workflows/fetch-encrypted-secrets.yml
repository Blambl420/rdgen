name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        env:
          RD_ZIP_URL_JSON: ${{ inputs.zip_url_json }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import os, re, urllib.parse
            import json
            import time

            input_data = json.loads(os.environ['RD_ZIP_URL_JSON'])
            assert isinstance(input_data, dict) and set(input_data) == {'url', 'file'}, 'Invalid ZIP metadata'
            assert re.fullmatch(r'secrets_[A-Za-z0-9-]+[.]zip', input_data['file']), 'Invalid ZIP filename'
            parsed = urllib.parse.urlsplit(input_data['url'])
            assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password, 'Invalid ZIP source'
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
