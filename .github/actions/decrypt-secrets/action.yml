name: Decrypt and validate RDGen inputs
description: Reject unsafe inputs before exporting any build environment variables
inputs:
  zip_password:
    description: Password for the ZIP
    required: true
  zip_path:
    description: Path to the encrypted ZIP
    required: false
    default: secrets.zip
runs:
  using: composite
  steps:
    - name: Install ZIP reader
      shell: bash
      run: python -m pip install pyzipper==0.3.6
    - name: Decrypt, validate and mask
      shell: python
      env:
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
        RD_INPUT_ZIP: ${{ inputs.zip_path }}
        RD_INPUT_PASSWORD: ${{ inputs.zip_password }}
      run: |
        """Validation before decrypted RDGen fields are written to GITHUB_ENV."""
        import base64
        import json
        import re
        
        FIELDS = set('server serverPort key apiServer custom uuid iconlink_url iconlink_uuid iconlink_file logolink_url logolink_uuid logolink_file privacylink_url privacylink_uuid privacylink_file appname genurl urlLink downloadLink delayFix rdgen xOffline removeNewVersionNotif compname androidappid filename'.split())
        
        def validate_inputs(values):
            if not isinstance(values, dict) or set(values) != FIELDS:
                raise ValueError('Unexpected encrypted input fields; review RDGen contract')
            for key, value in values.items():
                if not isinstance(value, str) or any(ord(c) < 32 or ord(c) == 127 for c in value):
                    raise ValueError('Invalid input type or control character: ' + key)
                # Current upstream scripts substitute these values into Bash, PowerShell,
                # sed and source strings. Reject their metacharacters before any export.
                if re.search(r'''[;&<>\\|'"$`]''', value):
                    raise ValueError('Unsafe build-script character: ' + key)
                if len(value) > (4 * 1024 * 1024 if key == 'custom' else 2048):
                    raise ValueError('Oversized build input: ' + key)
            for key in ('uuid', 'iconlink_uuid', 'logolink_uuid', 'privacylink_uuid',
                        'iconlink_file', 'logolink_file', 'privacylink_file', 'filename', 'androidappid'):
                if values[key] and not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', values[key]):
                    raise ValueError('Unsafe identifier: ' + key)
            if not values['serverPort'].isdigit() or not 1 <= int(values['serverPort']) <= 65532:
                raise ValueError('Invalid server port')
            for key in ('delayFix', 'rdgen', 'xOffline', 'removeNewVersionNotif'):
                if values[key] not in ('true', 'false'):
                    raise ValueError('Invalid boolean: ' + key)
            custom = json.loads(base64.b64decode(values['custom'], validate=True))
            if not isinstance(custom, dict):
                raise ValueError('Custom configuration must be an object')
            return values
        
        import os
        import pyzipper
        with pyzipper.AESZipFile(os.environ['RD_INPUT_ZIP']) as zf:
            zf.setpassword(os.environ['RD_INPUT_PASSWORD'].encode())
            info = zf.getinfo('secrets.json')
            if info.file_size > 5 * 1024 * 1024:
                raise ValueError('Encrypted input too large')
            values = validate_inputs(json.loads(zf.read(info)))
        # No environment write occurs until the entire input has passed validation.
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
            for key, value in values.items():
                if value:
                    print('::add-mask::' + value.replace('%', '%25'))
                    stream.write(key + '=' + value + '\n')
        print('Validated and masked RDGen inputs')
